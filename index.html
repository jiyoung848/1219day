<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, setDoc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ▼▼▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값으로 교체 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyCLfU9WY5a3KoNMiAiXuLRI-aa765AaRNE",
  authDomain: "day-aaf4a.firebaseapp.com",
  projectId: "day-aaf4a",
  storageBucket: "day-aaf4a.firebasestorage.app",
  messagingSenderId: "435683307167",
  appId: "1:435683307167:web:7f6233f082de9da2687caa"
};
// ▲▲▲ ----------------------------------------------------------- ▲▲▲

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const wishCol = collection(db, "wishlist");
const scheduleDoc = doc(db, "schedule", "main");

const list = document.getElementById('list');
let items = [];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){
  list.innerHTML='';
  if(!items.length){list.innerHTML='<p class="foot">아직 추가된 장소가 없어! 첫 장소를 추가해봐 🩷</p>';return}
  items.forEach(it=>{
    const votes = it.votes || [];
    let el=document.createElement('article');el.className='item';
    el.innerHTML=`<div class="itemtop"><span class="category">${esc(it.category)}</span><button class="btnsoft" data-del="${it.id}">삭제</button></div><h3>${esc(it.place)}</h3><div class="meta">${esc(it.author||'익명')} · ${esc(it.note||'메모 없음')}</div><div class="votes"><span>투표 ${votes.length}표</span>${['지영','정민','채경','해린'].map(n=>`<button class="vote" data-vote="${it.id}" data-name="${n}" style="${votes.includes(n)?'background:#f4c9da':''}">${n}${votes.includes(n)?' ✓':''}</button>`).join('')}</div>`;
    list.appendChild(el);
  });
}

// 실시간 구독: 누가 추가/삭제/투표하면 모두의 화면이 바로 바뀜
onSnapshot(query(wishCol, orderBy("createdAt","desc")), snap=>{
  items = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
}, err=>{
  console.error(err);
  list.innerHTML='<p class="foot">데이터를 불러오지 못했어 😢 (Firebase 설정/규칙을 확인해줘)</p>';
});

document.getElementById('add').onclick = async ()=>{
  let place=document.getElementById('place').value.trim();
  let author=document.getElementById('author').value;
  if(!author){alert('작성자를 선택해줘!');return}
  if(!place){alert('장소 이름을 입력해줘!');return}
  try{
    await addDoc(wishCol,{
      author,
      category:document.getElementById('category').value,
      place,
      note:document.getElementById('note').value.trim(),
      votes:[],
      createdAt:serverTimestamp()
    });
    document.getElementById('place').value='';
    document.getElementById('note').value='';
  }catch(e){console.error(e);alert('저장에 실패했어 😢 콘솔(F12)을 확인해줘')}
};

list.onclick = async e=>{
  const d=e.target.dataset.del;
  if(d!==undefined){ await deleteDoc(doc(db,"wishlist",d)); return }
  const v=e.target.dataset.vote;
  if(v!==undefined){
    const name=e.target.dataset.name;
    const it=items.find(x=>x.id===v);
    const has=(it.votes||[]).includes(name);
    await updateDoc(doc(db,"wishlist",v),{votes: has?arrayRemove(name):arrayUnion(name)});
  }
};

// 일정: 입력하면 0.5초 뒤 저장, 다른 사람이 바꾸면 실시간 반영
const schedule=document.getElementById('scheduleText');
let timer;
schedule.addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>setDoc(scheduleDoc,{text:schedule.value,updatedAt:serverTimestamp()}),500);
});
onSnapshot(scheduleDoc, snap=>{
  if(snap.exists() && document.activeElement!==schedule){
    schedule.value=snap.data().text||'';
  }
});

const modal=document.getElementById('modal');
document.getElementById('ticketBtn').onclick=()=>modal.classList.add('show');
document.getElementById('close').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
</script></body></html>
